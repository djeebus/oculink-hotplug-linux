# OCuLink GPU matching rules - sourced by every oculink-* script.
# Installed to /etc/oculink-gpu.conf. Edit this copy and re-run the installer;
# the installer overwrites the one in /etc.
#
# Find your values with:  lspci -nn | grep -Ei 'vga|3d|display'
#   c6:00.0 VGA compatible controller [0300]: ... Navi 31 ... [1002:744c]
#                                     class ^^^^         vendor ^^^^ ^^^^ device

# PCI vendor ID (1002 = AMD, 10de = NVIDIA, 8086 = Intel)
GPU_VENDOR_ID="1002"

# PCI classes to match (0300 = VGA compatible controller, 0302 = 3D controller).
# 0380 (Display controller) is left out on purpose: AMD APU iGPUs such as
# Strix Point report that class.
GPU_PCI_CLASSES="0300 0302"

# Optional space-separated device IDs. Empty matches any device from
# GPU_VENDOR_ID in the classes above; set this if your iGPU shares them.
GPU_DEVICE_IDS=""

# Before removal, processes with the GPU's /dev/dri nodes open are closed,
# except these (matched against the process name). Compositors usually hold
# every GPU open; they're left running and lose that GPU's displays instead of
# taking your whole session down.
GPU_SPARE_PROCESSES="Hyprland Xwayland Xorg sway kwin_wayland gnome-shell niri cosmic-comp"
